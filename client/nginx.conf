server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Never cache the runtime config — it is regenerated per environment.
  location = /env.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;
    try_files $uri =404;
  }

  # Hashed Vite assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA catch-all.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
