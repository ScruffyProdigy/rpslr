server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Never cache the runtime config — it is regenerated per environment.
  location = /env.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;
    try_files $uri =404;
  }

  # Hashed Vite assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA catch-all.
  #
  # index.html must never be served stale. It is the only thing that names
  # which hashed bundle to load, and those are immutable for a year — so a
  # browser holding an old index.html also still holds the old bundle it points
  # at, and quietly runs the previous release with nothing broken to notice. It
  # shipped with no Cache-Control at all, which left browsers free to guess a
  # freshness window from last-modified.
  #
  # `no-cache` stores it but revalidates every time, so the common case is a
  # cheap 304 rather than a re-download.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
