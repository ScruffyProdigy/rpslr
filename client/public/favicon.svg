<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RPSLR">
  <!--
    The board itself: five moves on a pentagon, joined by the beat graph.

    A single move would be the wrong mark — no one of the five is the game.
    The pentagon is what a player actually looks at, and it is legible as a
    shape long after the detail has gone: at 16px the five dots read as a
    pattern, and the ring behind them just thickens the silhouette.
  -->
  <rect width="64" height="64" rx="14" fill="#1a1d27"/>
  <g stroke="#6c8cff" fill="none" stroke-linejoin="round">
    <!-- The pentagram: every move beats the two nodes it points across to. -->
    <path d="M32 11 L44.3 49 L12 25.5 L52 25.5 L19.7 49 Z"
          stroke-width="2" opacity="0.22"/>
    <!-- The rim, lighter still. It thickens the silhouette; it is not detail. -->
    <path d="M32 11 L52 25.5 L44.3 49 L19.7 49 L12 25.5 Z"
          stroke-width="2.4" opacity="0.45"/>
  </g>
  <g fill="#6c8cff">
    <circle cx="32" cy="11" r="7"/>
    <circle cx="52" cy="25.5" r="7"/>
    <circle cx="44.3" cy="49" r="7"/>
    <circle cx="19.7" cy="49" r="7"/>
    <circle cx="12" cy="25.5" r="7"/>
  </g>
</svg>
