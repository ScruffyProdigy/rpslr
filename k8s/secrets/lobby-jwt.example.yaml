# EXAMPLE secret for FUTURE Lobby JWT validation config.
# Copy to lobby-jwt.yaml (gitignored) when enabling REQUIRE_LOBBY_AUTH=true.
# For v1 standalone mode this is not required.
apiVersion: v1
kind: Secret
metadata:
  name: rps-game-lobby-jwt
  namespace: rps-game
type: Opaque
stringData:
  # Optional shared secret / API key if Lobby requires one for server-to-server
  # calls. JWT *verification* itself uses the public JWKS endpoint (no secret).
  LOBBY_API_KEY: "CHANGE_ME_OPTIONAL"
