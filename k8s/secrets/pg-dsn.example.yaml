# EXAMPLE secret — copy to pg-dsn.yaml and fill in real values.
# pg-dsn.yaml is gitignored (see .gitignore: k8s/secrets/*.yaml).
#
#   cp k8s/secrets/pg-dsn.example.yaml k8s/secrets/pg-dsn.yaml
#   # edit values, then it is applied by scripts/deploy-*.sh
#
# This is the GAME's own database — never Lobby's.
apiVersion: v1
kind: Secret
metadata:
  name: rps-game-pg-dsn
  namespace: rps-game
type: Opaque
stringData:
  POSTGRES_USER: "rps"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "rps_game"
  # Point at in-cluster Postgres (service name) or an external managed DB.
  DATABASE_URL: "postgres://rps:CHANGE_ME@rps-game-postgres:5432/rps_game"
