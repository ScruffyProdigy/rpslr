apiVersion: v1
kind: Service
metadata:
  name: rps-game-api
  labels:
    app: rps-game-api
    joinquest.io/game-id: rock-paper-scissors-lizard-robot
spec:
  selector:
    app: rps-game-api
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rps-game-api
  labels:
    app: rps-game-api
    joinquest.io/game-id: rock-paper-scissors-lizard-robot
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: rps-game-api
  template:
    metadata:
      labels:
        app: rps-game-api
        joinquest.io/game-id: rock-paper-scissors-lizard-robot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      # Run DB migrations before the API starts.
      initContainers:
        - name: migrate
          image: docker.io/scruffyprodigy/rps-game-api:rpsls
          imagePullPolicy: Always
          command: ["node", "dist/migrate.js"]
          envFrom:
            - configMapRef:
                name: rps-game-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rps-game-pg-dsn
                  key: DATABASE_URL
      containers:
        - name: api
          image: docker.io/scruffyprodigy/rps-game-api:rpsls
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          # No hardcoded env in base — everything comes from the ConfigMap overlay.
          envFrom:
            - configMapRef:
                name: rps-game-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rps-game-pg-dsn
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
