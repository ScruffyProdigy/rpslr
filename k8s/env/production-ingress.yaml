# Production ingress — host https://rpsls-duel.win
# Applied after k8s/base/ingress.yaml by scripts/_deploy.sh (production only).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rps-game
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - rpsls-duel.win
      secretName: rpsls-duel-win-tls
  rules:
    - host: rpsls-duel.win
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: rps-game-api
                port:
                  number: 3001
          # Kept in step with k8s/base/ingress.yaml: this overlay replaces the
          # base rules wholesale, so a path added only there never reaches
          # production (JQ-120).
          - path: /replay
            pathType: Prefix
            backend:
              service:
                name: rps-game-api
                port:
                  number: 3001
          # The short replay link printed and QR-encoded on the story card
          # (JQ-122). Prefix matching is element-wise, so this takes /r/RPS-K7M2
          # and leaves /replay alone.
          - path: /r
            pathType: Prefix
            backend:
              service:
                name: rps-game-api
                port:
                  number: 3001
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: rps-game-api
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rps-game-client
                port:
                  number: 80
