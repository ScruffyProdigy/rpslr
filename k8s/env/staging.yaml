# STAGING ConfigMap overlay.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rps-game-api-config
data:
  GAME_APP_ENV: "staging"
  API_PORT: "3001"
  REQUIRE_LOBBY_AUTH: "true"
  CORS_ALLOWED_ORIGINS: "https://lobby.staging.joinquest.example"
  GAME_API_AUDIENCE: "https://rps.staging.joinquest.example"
  # Where /replay fetches the SPA shell from for link-preview meta (JQ-120).
  # In-cluster service, not the public host — no hairpin through the ingress.
  GAME_CLIENT_ORIGIN: "http://rps-game-client"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rps-game-client-config
data:
  GAME_APP_ENV: "staging"
  # Browser calls API via ingress /api prefix; JWT aud uses GAME_API_AUDIENCE above.
  GAME_API_BASE_URL: "https://rps.staging.joinquest.example/api"
  GAME_WS_BASE_URL: ""
  # Where "Play RPSLR on JoinQuest" sends a replay watcher. Blank falls back
  # to the game's page on joinquest.cc; set it to point at another Lobby.
  GAME_LOBBY_URL: ""
