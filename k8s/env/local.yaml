# LOCAL cluster ConfigMap overlay (kind/minikube/docker-desktop).
# DATABASE_URL is NOT here — it comes from the pg-dsn Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rps-game-api-config
data:
  GAME_APP_ENV: "local"
  API_PORT: "3001"
  REQUIRE_LOBBY_AUTH: "false"
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://rps-game.local"
  # Lobby GraphQL auth: provision lobby.serviceToken (stored per match)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rps-game-client-config
data:
  GAME_APP_ENV: "local"
  GAME_API_BASE_URL: "http://rps-game.local/api"
  # Blank -> client derives ws://rps-game.local/api/api/v1/ws from the API base.
  GAME_WS_BASE_URL: ""
