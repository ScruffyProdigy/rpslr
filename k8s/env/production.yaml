# PRODUCTION ConfigMap overlay — GKE at https://rpsls-duel.win
# Ingress host/TLS: k8s/env/production-ingress.yaml (applied after base).
apiVersion: v1
kind: ConfigMap
metadata:
  name: rps-game-api-config
data:
  GAME_APP_ENV: "production"
  API_PORT: "3001"
  REQUIRE_LOBBY_AUTH: "true"
  # Extra browser origins only (optional). GAME_API_AUDIENCE is always allowed for CORS/WS.
  # Normal play does not need joinquest.cc — the UI runs on this host. Keep only for tooling.
  CORS_ALLOWED_ORIGINS: ""
  # Seat JWT `aud` — API origin (scheme + host), not the /api ingress path.
  GAME_API_AUDIENCE: "https://rpsls-duel.win"
  # Browser origin for launchUrls on provision (must match Lobby catalog playUrl).
  GAME_PLAY_URL: "https://rpsls-duel.win"
  # Where /replay fetches the SPA shell from for link-preview meta (JQ-120).
  # In-cluster service, not the public host — no hairpin through the ingress.
  GAME_CLIENT_ORIGIN: "http://rps-game-client"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rps-game-client-config
data:
  GAME_APP_ENV: "production"
  GAME_API_BASE_URL: "https://rpsls-duel.win"
  GAME_WS_BASE_URL: ""
  # Where "Play RPSLR on JoinQuest" sends a replay watcher. Blank falls back
  # to the game's page on joinquest.cc; set it to point at another Lobby.
  GAME_LOBBY_URL: "https://joinquest.cc/games/rock-paper-scissors-lizard-robot"
